# Weekly data refresh: rerun the pipeline so "Trending now" and "New spots" stay current,
# then commit the updated data. "Deploy site" runs automatically afterwards.
# API responses are cached between runs (actions/cache), so a refresh only pays for what's new.
name: Refresh data

on:
  schedule:
    - cron: "0 1 * * 1"   # Mondays 01:00 UTC (08:00 in Jakarta)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        run: |
          for k in GEMINI_API_KEY GROQ_API_KEY YOUTUBE_API_KEY TAVILY_API_KEY; do
            if [ -z "${!k}" ]; then echo "::error::Missing repository secret $k"; exit 1; fi
          done

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore API cache
        uses: actions/cache@v6
        with:
          path: |
            data/cache
            data/raw
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: pipeline-cache-

      - name: Run pipeline
        working-directory: pipeline
        run: |
          python seed_osm.py
          python discover.py
          python resolve.py
          python collect.py
          python enrich.py
          python structure.py
          python photos.py
          python score.py
          python index.py
          python export_web.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places.json data/places_raw.json data/vectors.json data/coverage_report.md web/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Weekly data refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
